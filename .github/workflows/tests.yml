name: Automated API tests using Postman CLI

on:
  push:
  workflow_dispatch:

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Run API tests
        run: |
          postman collection run "27327465-6ee30632-3cda-4d1f-bdd3-2d2ce4253ab7" -e "27327465-4b6823cb-6b02-4370-8d06-bf25f8fb2029"
      - name: Lint Spec
        run: |
          postman spec lint f5e01e65-e370-4925-ae2b-8daa70976dba
    
